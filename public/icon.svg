  <line x1="33" y1="38.5" x2="36" y2="45.5" stroke="#f9b08f" stroke-width="1.6"/>
  <line x1="40" y1="38.5" x2="43" y2="45.5" stroke="#f9b08f" stroke-width="1.6"/>
