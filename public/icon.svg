  <circle cx="14.5" cy="44" r="2.8" fill="#4e8f43"/>
  <!-- pétalo -->
  <path d="M50 6 c3 2 5 4 4.5 7 c-3 -1 -5 -3 -4.5 -7 Z" fill="#ef9fb8"/>
